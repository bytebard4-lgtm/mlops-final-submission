name: CD Pipeline (Build, Push & Deploy)

on:
  push:
    branches:
      - main

jobs:
  # ── Stage 1: Run tests before deploying ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      HOME: /tmp
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests -v --tb=short

      - name: Train model (ensure artifact is fresh)
        run: python src/train_models.py

  # ── Stage 2: Build & push Docker image ───────────────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python & train model (needed for best_model.pkl in image)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps & train
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/train_models.py
        env:
          PYTHONPATH: .
          HOME: /tmp
          MLFLOW_TRACKING_URI: file:./mlruns

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }}

  # ── Stage 3: Deploy to Kind Kubernetes cluster ────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s \
            https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Create Kind cluster
        run: kind create cluster --name mlops-cluster

      - name: Load Docker image into Kind
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest
          kind load docker-image \
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
            --name mlops-cluster

      - name: Deploy Flask app to Kubernetes
        run: |
          kubectl apply -f k8s/flask-deployment.yaml
          kubectl apply -f k8s/flask-service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/mlops-flask --timeout=120s

      - name: Smoke test the deployed API
        run: |
          kubectl port-forward service/mlops-flask 8080:5002 &
          sleep 5
          curl -f http://localhost:8080/health
          echo "Health check passed"
          curl -f -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'
          echo "Predict endpoint passed"

