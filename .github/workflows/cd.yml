name: CD Pipeline (Build, Push & Deploy)

on:
  push:
    branches:
      - main

jobs:
  # ── 1. Gate: tests must pass before anything deploys ────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      HOME: /tmp
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests -v --tb=short

      - name: Train model
        run: python src/train_models.py

  # ── 2. Build Docker image and push to Docker Hub ─────────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps & train (bake model into image)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/train_models.py
        env:
          PYTHONPATH: .
          HOME: /tmp
          MLFLOW_TRACKING_URI: file:./mlruns

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }}

  # ── 3. Deploy to Kind Kubernetes cluster ─────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s \
            https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Create Kind cluster
        run: kind create cluster --name mlops-cluster

      # Pull the image we just pushed and load it into Kind
      - name: Load image into Kind
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest
          kind load docker-image \
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
            --name mlops-cluster

      # Patch the placeholder in the manifest with the real Docker Hub username
      - name: Set Docker Hub username in manifest
        run: |
          sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            k8s/flask-deployment.yaml

      - name: Deploy Flask app to Kubernetes
        run: |
          kubectl apply -f k8s/flask-deployment.yaml
          kubectl apply -f k8s/flask-service.yaml

      # Give the pod time to start — 180 s is enough for a cold Kind cluster
      - name: Wait for rollout
        run: kubectl rollout status deployment/mlops-flask --timeout=180s

      - name: Smoke test deployed API
        run: |
          kubectl port-forward service/mlops-flask 8080:5002 &
          sleep 8
          curl -f http://localhost:8080/health
          echo ""
          curl -f -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'
          echo ""
          echo "Smoke test PASSED"
