name: CD Pipeline (Build, Push & Deploy)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────────────────────
  # 1. Validate code before deployment
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      HOME: /tmp
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint code
        run: |
          pip install flake8
          flake8 src app --max-line-length=100

      - name: Run unit tests
        run: pytest tests -v --tb=short

      - name: Train model
        run: python src/train_models.py

      - name: Verify model artifact exists
        run: |
          if [ ! -f models/best_model.pkl ]; then
            echo "ERROR: best_model.pkl not found after training"
            exit 1
          fi

          echo "Model artifact verified OK"

  # ─────────────────────────────────────────────────────────────
  # 2. Build Docker image and push to Docker Hub
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    needs: test

    # Only deploy on direct pushes to main
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      HOME: /tmp
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model for Docker image
        run: python src/train_models.py

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy to Kubernetes using Kind
  # ─────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s \
          https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Create Kind cluster
        run: kind create cluster --name mlops-cluster

      - name: Pull Docker image
        run: |
          docker pull \
          ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest

      - name: Load image into Kind cluster
        run: |
          kind load docker-image \
          ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest \
          --name mlops-cluster

      - name: Replace Docker Hub username in manifest
        run: |
          sed -i \
          "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" \
          k8s/flask-deployment.yaml

      - name: Deploy Flask application
        run: |
          kubectl apply -f k8s/flask-deployment.yaml
          kubectl apply -f k8s/flask-service.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/mlops-flask --timeout=180s

      - name: Smoke test deployed API
        run: |
          kubectl port-forward service/mlops-flask 8080:5002 &
          sleep 8

          curl -f http://localhost:8080/health

          echo ""

          curl -f -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'

          echo ""
          echo "Smoke test PASSED"
