name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repo
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      # =========================
      # 2. Python setup
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # =========================
      # 3. Cache pip (faster builds)
      # =========================
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      # =========================
      # 4. Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 5. Code quality (linting)
      # =========================
      - name: Lint code
        run: |
          pip install flake8
          flake8 src app

      # =========================
      # 6. Unit tests (IMPORTANT FIX)
      # =========================
      - name: Run unit tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/ -v

      # =========================
      # 7. Smoke test training pipeline
      # =========================
      - name: Smoke test training pipeline
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python src/train_models.py
