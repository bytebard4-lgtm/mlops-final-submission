name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      HOME: /tmp
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint code
        run: |
          pip install flake8
          flake8 src app --max-line-length=100

      - name: Run unit tests
        run: pytest tests -v --tb=short

      - name: Smoke test training pipeline
        run: python src/train_models.py

      - name: Verify model artifact exists
        run: |
          if [ ! -f models/best_model.pkl ]; then
            echo "ERROR: best_model.pkl not found after training"
            exit 1
          fi
          echo "Model artifact verified OK"
